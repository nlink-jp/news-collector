# Cloud Run Job definition for news-collector
#
# Before deploying, replace all placeholders:
#   PROJECT_ID  — your GCP project ID
#   BUCKET_NAME — your GCS bucket name (e.g. ${PROJECT_ID}-data)
#   SA_EMAIL    — your service account email
#
# Deploy:
#   gcloud builds submit --tag gcr.io/${PROJECT_ID}/news-collector:latest --project ${PROJECT_ID}
#   gcloud run jobs replace deploy/cloudrunjob.yaml --region us-central1 --project ${PROJECT_ID}
#
# Manual test run:
#   gcloud run jobs execute news-collector --region us-central1 --project ${PROJECT_ID} --wait

apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: news-collector
spec:
  template:
    spec:
      template:
        spec:
          containers:
            - image: gcr.io/PROJECT_ID/news-collector:latest
              resources:
                limits:
                  memory: "512Mi"
                  cpu: "1"
              env:
                - name: GOOGLE_CLOUD_PROJECT
                  value: "PROJECT_ID"
                - name: GOOGLE_CLOUD_LOCATION
                  value: "us-central1"
                - name: GCS_BUCKET
                  value: "BUCKET_NAME"
                - name: SWRITE_MODE
                  value: "server"
                - name: SWRITE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: slack-bot-token
                      key: latest
                - name: SWRITE_CHANNEL
                  value: "#news_collector"
                - name: NEWS_LANG
                  value: "ja"
                - name: POST_MODE
                  value: "curate"
          timeoutSeconds: 1800
          serviceAccountName: SA_EMAIL
