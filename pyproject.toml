[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "news-collector"
version = "0.2.1"
description = "News collection agent — collects, structures, tags, and summarizes news articles via Gemini"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.67.0",
    "pydantic>=2.12.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "jinja2>=3.1.0",
]

[project.scripts]
news-collector = "news_collector.cli:main"

[project.urls]
Repository = "https://github.com/nlink-jp/news-collector"

[tool.setuptools.packages.find]
include = ["news_collector*"]

[tool.setuptools.package-data]
news_collector = ["templates/*.html", "static/*.css", "static/*.js"]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=8.0.0",
]
